[project]
name = "tinypan"
version = "0.1.0"
description = "Minimal contrastive goal-conditioned RL on DeepMind Control (stage 1: contrastive value learning, stage 2: advantage-weighted action decoding)."
requires-python = ">=3.11"
dependencies = [
    "jax",
    "flax",
    "optax",
    "dm_control",
    "numpy",
    "matplotlib",
    "tqdm",
    "imageio",
    "imageio-ffmpeg",
    "pillow",
]

[project.optional-dependencies]
push_t = ["gym-pusht", "pymunk<7"]

# On the training machine (4090 / CUDA), install the CUDA jax wheel instead of
# plain "jax":
#   pip install -U "jax[cuda12]"
